name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release and attach the APK'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Release tag name (e.g., v1.0.0)'
        required: false
        type: string
        default: 'v1.0.0'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Horse Racing Adventure 2D APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Project Type & Validate Sources
        id: project-check
        run: |
          echo "=== Inspecting Project Structure ==="
          if [ -f "build.gradle.kts" ] || [ -f "build.gradle" ]; then
            echo "project_type=android-gradle" >> $GITHUB_OUTPUT
            echo "Detected Android Gradle project."
          elif [ -f "index.html" ]; then
            echo "project_type=web" >> $GITHUB_OUTPUT
            echo "Detected Web project."
          else
            echo "::error::Neither an Android Gradle project nor a web project was found!"
            exit 1
          fi

          # Verify game files exist
          if [ ! -f "index.html" ] && [ ! -f "app/src/main/assets/index.html" ]; then
            echo "::error::Critical game entry point (index.html) is missing!"
            exit 1
          fi

          # Ensure Android assets directory is synchronized with the latest web game files
          if [ -d "app/src/main" ]; then
            mkdir -p app/src/main/assets
            for file in index.html style.css game.js audio.js levels.js; do
              if [ -f "$file" ]; then
                cp -v "$file" "app/src/main/assets/$file"
              fi
            done
            echo "Android assets synchronized successfully."
          fi

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Android Keystore and Configuration
        run: |
          echo "=== Configuring Build Environment ==="
          
          # Create placeholder .env if not present
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
            echo "Created .env configuration file."
          fi

          # Ensure debug keystore is available for signing
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore
              echo "Restored debug.keystore from base64 encoding."
            else
              keytool -genkey -v -keystore debug.keystore -alias androiddebugkey \
                -storepass android -keypass android -keyalg RSA -keysize 2048 \
                -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
              echo "Generated a new debug.keystore."
            fi
          fi

          # Ensure Gradle wrapper script is executable
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "Gradle wrapper script not found, generating wrapper..."
            gradle wrapper
            chmod +x ./gradlew
          fi

      - name: Build Android Debug APK
        run: |
          echo "=== Building Android APK with Gradle Wrapper ==="
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify and Package APK
        id: package-apk
        run: |
          echo "=== Locating Built APK ==="
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::Built APK was not found in app/build/outputs/apk/debug!"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH" 2>/dev/null)
          echo "Found APK: $APK_PATH (Size: $FILE_SIZE bytes)"

          if [ "$FILE_SIZE" -lt 1000000 ]; then
            echo "::error::Generated APK is suspiciously small ($FILE_SIZE bytes). Build may be incomplete."
            exit 1
          fi

          TARGET_APK="Horse-Racing-Adventure-2D.apk"
          cp "$APK_PATH" "$TARGET_APK"
          echo "Copied APK to $TARGET_APK"

          echo "apk_path=$TARGET_APK" >> $GITHUB_OUTPUT
          echo "apk_size=$FILE_SIZE" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Horse-Racing-Adventure-2D-APK
          path: Horse-Racing-Adventure-2D.apk
          if-no-files-found: error
          retention-days: 30

      - name: Determine Release Execution
        id: release-check
        run: |
          SHOULD_RELEASE="false"
          TAG_NAME="v1.0.0"

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            SHOULD_RELEASE="true"
            TAG_NAME="${{ github.ref_name }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.create_release }}" == "true" ]]; then
            SHOULD_RELEASE="true"
            if [ -n "${{ inputs.release_tag }}" ]; then
              TAG_NAME="${{ inputs.release_tag }}"
            fi
          fi

          echo "should_release=$SHOULD_RELEASE" >> $GITHUB_OUTPUT
          echo "release_tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Release requested: $SHOULD_RELEASE (Tag: $TAG_NAME)"

      - name: Create or Update GitHub Release
        if: steps:release-check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps:release-check.outputs.release_tag }}
          name: "Horse Racing Adventure 2D ${{ steps:release-check.outputs.release_tag }}"
          body: |
            ## Horse Racing Adventure 2D - Android Release

            Installable Android APK for **Horse Racing Adventure 2D** built automatically via GitHub Actions.

            ### Features:
            - **50 Unique Playable Levels** with increasing steeplechase challenges and AI opponents.
            - **Realistic 2D Equestrian Physics**: Natural bascule jumping arc and obstacle clearance.
            - **Manual Touch Controls**: RUN (hold-to-gallop), JUMP, and QUICK FEED buttons.
            - **Economy & Upgrades**: Working coin balance, 10 rider outfits, 7 horse foods, and 3 stable stat training gauges.
            - **Full Device Rotation**: Play horizontally in landscape mode with automatic orientation adaptation.
            - **Self-contained Audio**: Procedural sound effects and upbeat racing soundtrack.

            ### Installation:
            Download and install `Horse-Racing-Adventure-2D.apk` directly on any Android 7.0+ (API 24+) phone or tablet.
          files: Horse-Racing-Adventure-2D.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
